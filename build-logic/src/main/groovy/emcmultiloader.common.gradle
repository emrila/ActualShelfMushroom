plugins {
    id 'emcmultiloader.base'
}

configurations {
    commonJava {
        description = 'Loader-neutral Java sources'
        canBeResolved = false
        canBeConsumed = true
    }

    commonResources {
        description = 'Loader-neutral resources'
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    add 'commonJava', sourceSets.main.java.sourceDirectories.singleFile
    add 'commonResources', sourceSets.main.resources.sourceDirectories.singleFile
}