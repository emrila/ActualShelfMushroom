plugins {
    id 'emcmultiloader.base'
}

configurations {
    commonJava {
        description = 'Loader-neutral Java sources consumed by this loader'
        canBeResolved = true
        canBeConsumed = false
    }

    commonResources {
        description = 'Loader-neutral resources consumed by this loader'
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    compileOnly project(':common')

    commonJava project(
            path: ':common',
            configuration: 'commonJava'
    )

    commonResources project(
            path: ':common',
            configuration: 'commonResources'
    )
}

tasks.named('compileJava', JavaCompile) {
    dependsOn configurations.commonJava
    source configurations.commonJava
}

tasks.named('processResources', ProcessResources) {
    dependsOn configurations.commonResources
    from configurations.commonResources
}

tasks.named('sourcesJar', Jar) {
    dependsOn configurations.commonJava
    from configurations.commonJava

    dependsOn configurations.commonResources
    from configurations.commonResources
}

tasks.named('javadoc', Javadoc) {
    dependsOn configurations.commonJava
    source configurations.commonJava
}